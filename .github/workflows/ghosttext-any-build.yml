name: Build ghosttext-any for Win7 (Fork)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork Source
        uses: actions/checkout@v4 # Тот самый важный шаг

      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Install Rust 1.75.0
        uses: dtolnay/rust-toolchain@1.75.0
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build with Cargo.lock
        run: |
          # Собираем из исходников форка, строго следуя Cargo.lock
          cargo build --release --target x86_64-pc-windows-gnu --locked

      - name: Find the binary
        run: find target -name "ghosttext-any.exe"

      - name: Locate all executables
        run: find target -name "*.exe"

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: ghosttext-any-win7
          path: target/x86_64-pc-windows-gnu/release/ghosttext-any.exe
